<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nurie</title>
    <style>
      :root {
        --bg: #f4f4f2;
        --panel: #ffffff;
        --border: #d8d8d4;
        --text: #222;
        --muted: #666;
        --accent: #2563eb;
        --checker: repeating-conic-gradient(#e8e8e8 0% 25%, #fff 0% 50%) 0 0 / 16px 16px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      #app { display: flex; min-height: 100vh; }
      aside {
        width: 320px;
        flex: none;
        padding: 16px;
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
        max-height: 100vh;
        position: sticky;
        top: 0;
      }
      h1 { font-size: 20px; margin: 0; }
      section { display: flex; flex-direction: column; gap: 8px; }
      h2 { font-size: 13px; margin: 0; color: var(--muted); font-weight: 600; }
      button, input[type="file"]::file-selector-button {
        font: inherit;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fafafa;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: #eee; }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      button.primary:hover:not(:disabled) { background: #1d4ed8; }
      .row { display: flex; gap: 8px; align-items: center; }
      .row > * { min-width: 0; }
      .grow { flex: 1; }
      .channel { display: grid; grid-template-columns: 16px 1fr 72px; gap: 8px; align-items: center; }
      input[type="number"], input[type="text"] {
        font: inherit;
        padding: 4px 6px;
        border: 1px solid var(--border);
        border-radius: 6px;
        width: 100%;
      }
      .swatch {
        width: 40px; height: 40px; flex: none;
        border: 1px solid var(--border); border-radius: 6px;
        background: var(--checker);
        position: relative; overflow: hidden;
      }
      .swatch > i { position: absolute; inset: 0; }
      #picker { width: 40px; height: 40px; padding: 0; border: none; background: none; flex: none; }
      #recent { display: flex; flex-wrap: wrap; gap: 6px; }
      #recent .swatch { width: 26px; height: 26px; padding: 0; border-radius: 4px; cursor: pointer; }
      #balance-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: #eee; }
      #balance-bar i:nth-child(1) { background: #e11d48; }
      #balance-bar i:nth-child(2) { background: #16a34a; }
      #balance-bar i:nth-child(3) { background: #2563eb; }
      #balance-text { font-variant-numeric: tabular-nums; font-size: 13px; line-height: 1.6; }
      .tools label { display: block; cursor: pointer; }
      .tools small { display: block; margin-left: 24px; }
      small { color: var(--muted); }
      main {
        flex: 1;
        min-width: 0;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }
      #stage {
        position: relative;
        max-width: 100%;
        background: var(--checker);
        border: 1px solid var(--border);
        line-height: 0;
      }
      #canvas { display: block; max-width: 100%; height: auto; touch-action: none; }
      #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      #stage[data-tool="brush"] #canvas { cursor: cell; }
      #stage[data-tool="fill"] #canvas, #stage[data-tool="multi"] #canvas { cursor: crosshair; }
      #status {
        min-height: 1.6em;
        font-size: 13px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      #empty {
        padding: 80px 40px;
        text-align: center;
        color: var(--muted);
        border: 2px dashed var(--border);
        border-radius: 12px;
        background: var(--panel);
      }
      #stage.dragging, #empty.dragging { outline: 3px solid var(--accent); }
      @media (max-width: 720px) {
        #app { flex-direction: column; }
        aside { width: auto; max-height: none; position: static; border-right: none; border-bottom: 1px solid var(--border); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside>
        <h1>nurie</h1>

        <section>
          <h2>画像</h2>
          <input id="file" type="file" accept="image/*" />
          <div class="row">
            <button id="sample-house" class="grow">サンプル: 家</button>
            <button id="sample-rings" class="grow">サンプル: 輪</button>
          </div>
          <small>ドラッグ＆ドロップ、貼り付け（Ctrl+V）でも読み込めます。</small>
        </section>

        <section>
          <h2>線の抽出（黒い部分だけ拾う）</h2>
          <div class="row">
            <input id="threshold" type="range" min="10" max="255" value="128" class="grow" />
            <span id="threshold-value">128</span>
          </div>
          <small>小さいほど薄い線まで拾います。塗りがはみ出す（線が途切れている）ときは小さくしてみてください。しきい値を変えると領域の番号と選択は作り直されます。</small>
        </section>

        <section>
          <h2>色（RGB + 透明度）</h2>
          <div class="row">
            <input id="picker" type="color" value="#ff0000" aria-label="色を選ぶ" />
            <div class="swatch"><i id="swatch"></i></div>
            <input id="hex" type="text" value="#ff0000" spellcheck="false" aria-label="16進数の色（#rrggbb または #rrggbbaa）" />
          </div>
          <div class="channel">
            <span>R</span><input id="r-range" type="range" min="0" max="255" value="255" /><input id="r" type="number" min="0" max="255" value="255" />
          </div>
          <div class="channel">
            <span>G</span><input id="g-range" type="range" min="0" max="255" value="0" /><input id="g" type="number" min="0" max="255" value="0" />
          </div>
          <div class="channel">
            <span>B</span><input id="b-range" type="range" min="0" max="255" value="0" /><input id="b" type="number" min="0" max="255" value="0" />
          </div>
          <div class="channel">
            <span>A</span><input id="a-range" type="range" min="0" max="255" value="255" /><input id="a" type="number" min="0" max="255" value="255" />
          </div>
          <div id="balance-bar" aria-hidden="true"><i></i><i></i><i></i></div>
          <div id="balance-text"></div>
          <small>バランスは R+G+B を 100% としたときの各色の割合。A は不透明度（0 = 透明）。</small>
          <h2>最近使った色</h2>
          <div id="recent"></div>
        </section>

        <section class="tools">
          <h2>ツール</h2>
          <label><input type="radio" name="tool" value="fill" checked />塗りつぶし
            <small>クリックした領域をすぐ塗る</small></label>
          <label><input type="radio" name="tool" value="multi" />複数選択
            <small>クリックで選択・解除。「選択を塗る」で同じ色にまとめて塗る</small></label>
          <label><input type="radio" name="tool" value="brush" />線に沿って塗る
            <small>ドラッグでなぞった所の黒い線だけを塗る</small></label>
          <div class="channel" style="grid-template-columns: auto 1fr 56px">
            <span>太さ</span><input id="brush" type="range" min="1" max="60" value="8" /><input id="brush-n" type="number" min="1" max="60" value="8" />
          </div>
        </section>

        <section>
          <h2>領域の番号</h2>
          <label class="row"><input id="show-numbers" type="checkbox" />番号を画像に表示する</label>
          <div class="row">
            <input id="region-text" type="text" class="grow" placeholder="例: 1, 3, 5-8" spellcheck="false" aria-label="領域の番号" />
            <button id="region-select">選択</button>
          </div>
          <div id="selection-text" class="row"><small></small></div>
          <div class="row">
            <button id="paint-selected" class="primary grow" disabled>選択を塗る</button>
          </div>
          <div class="row">
            <button id="select-all" class="grow" disabled>すべて選択</button>
            <button id="select-none" class="grow" disabled>選択を解除</button>
          </div>
        </section>

        <section>
          <h2>操作</h2>
          <div class="row">
            <button id="undo" class="grow" disabled>元に戻す</button>
            <button id="redo" class="grow" disabled>やり直し</button>
          </div>
          <button id="reset-lines" disabled>線の色を黒に戻す</button>
          <button id="clear" disabled>色をすべて消す</button>
          <button id="save" disabled>PNG で保存（透明度つき）</button>
        </section>
      </aside>

      <main>
        <div id="empty">画像を選ぶか、ここにドラッグ＆ドロップしてください。<br />左の「サンプル」からも試せます。</div>
        <div id="stage" hidden data-tool="fill">
          <canvas id="canvas"></canvas>
          <canvas id="overlay"></canvas>
        </div>
        <div id="status"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
